name: Cleanup GHCR untagged images

on:
  schedule:
    - cron: '0/5 0 * * 0'
    # - cron: '0 3 * * 0'
  workflow_dispatch: {}

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete untagged images, keep last 2 tagged
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: task-frontend
          tag-selection: untagged
          cut-off: 7d
          dry-run: true