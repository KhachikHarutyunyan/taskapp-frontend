name: Cleanup GHCR untagged images

on:
  schedule:
    - cron: '*/5 * * * *'
    # - cron: '0 3 * * 0'
  workflow_dispatch: {}

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Cleanup old tagged images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: "task-frontend"
          # ✅ Удаляем именно ТЕГИРОВАННЫЕ образы
          delete-tags: true
          # Регекс: SHA-подобные теги (40 символов hex)
          tags: "^[0-9a-f]{40}$"
          # НЕ трогаем latest и buildcache
          exclude-tags: "^latest$|^buildcache$"
          # Храним 2 последних SHA-образа
          keep-n-tagged: 2
          dry-run: true
