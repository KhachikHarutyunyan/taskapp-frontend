name: CI - Build and Push Frontend Image

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  GITOPS_REPO: KhachikHarutyunyan/taskapp
  GITOPS_VALUES_FILE: environments/dev/frontend-values.yaml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Important to push in GHCR with GITHUB_TOKEN
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/task-frontend" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # Auth in GHCR with GITHUB_TOKEN
      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nginx/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      # Checkout GitOps-repository (only if push)
      - name: Checkout GitOps repository
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GHCR_PAT }}   # PAT with permission to write in taskapp
          path: gitops-repo
          ref: main

      # Install yq
      - name: Install yq
        if: github.event_name == 'push'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # Update tag in values-file
      - name: Update image tag in GitOps values
        if: github.event_name == 'push'
        run: |
          cd gitops-repo
          yq eval ".image.tag = \"${{ github.sha }}\"" -i "${{ env.GITOPS_VALUES_FILE }}"
          echo "Updated image tag to ${{ github.sha }} in ${{ env.GITOPS_VALUES_FILE }}"
          cat "${{ env.GITOPS_VALUES_FILE }}"

      # Commit and push to GitOps-repository
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          cd gitops-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ env.GITOPS_VALUES_FILE }}"
          # Check, is realy have a changes (protecting from empty commits)
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: update frontend image tag to ${{ github.sha }} [skip ci]"
            git push origin main
            echo "Pushed new tag ${{ github.sha }} to ${{ env.GITOPS_REPO }}"
          fi