# upstream backend {
#     server backend:8201;
# }

upstream backend {
    # server backend-service:8201; # Backend Service name in same namespace
    server backend-service.testapp-stage.svc.cluster.local:8201; # frontend in ns frontend-ns and backend service name from ns testapp-stage
}

# Frontend server
server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;
    
    root /usr/share/nginx/html;
    index index.html;
    
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

     # API proxy to backend
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }
    
    
    location ~* \.(jpg|jpeg|png|gif|ico|svg|css|js|webp|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
    
    
    location ~ ^/(admin|metrics) {
        deny all;
        return 404;
    }

    # Gzip Settings
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
